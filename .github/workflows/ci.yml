name: CI

on:
  push:
    branches: [main]
  pull_request:

# No publish step. Releases are deliberate and manual; see docs/DEPLOYMENT.md.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Integration and compatibility tests
        run: npm run test:integration && npm run test:compat

      - name: Verify both Workers build
        run: npm run build:auth && npm run build:mcp

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          if-no-files-found: warn
